name: Deploy using Docker Compose

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      DO_API_TOKEN: ${{ secrets.dop_v1_1acbf9728819048e5bee16181279e4e2b1f82ef8f924f6f8932d4fab31855a53 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: maxansari/nithms-v2:1.0
          context: ./backend

      - name: Deploy using SSH and Docker Compose
        run: |
          ssh -o StrictHostKeyChecking=no root@64.227.158.195 << EOF
            cd /root/MyApps/NIT-HOSTEL-V2/backend/
            docker-compose down
            docker-compose pull
            docker-compose up -d --build
          EOF
