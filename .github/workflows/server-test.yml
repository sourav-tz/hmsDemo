name: Deploy using Docker Compose

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      DO_API_TOKEN: ${{ secrets.dop_v1_1acbf9728819048e5bee16181279e4e2b1f82ef8f924f6f8932d4fab31855a53 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Deploy using SSH and Docker Compose
        run: |
          ssh -o StrictHostKeyChecking=no root@64.227.158.195 << EOF
            cd /root/MyApps/NIT-HOSTEL-V2/backend/
            docker-compose down
            docker-compose pull
            docker-compose up -d --build
          EOF
